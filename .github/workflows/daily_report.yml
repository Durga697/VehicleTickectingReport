name: Daily Vehicle Open Ticket Report

on:
  schedule:
    # Runs every day at 10:00 AM IST (04:30 AM UTC)
    - cron: '30 4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.vscode/**'

jobs:
  run-daily-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run daily ticket report
        env:
          WHIZZARD_USER: ${{ secrets.WHIZZARD_USER != '' && secrets.WHIZZARD_USER || '7658978951' }}
          WHIZZARD_PASS: ${{ secrets.WHIZZARD_PASS != '' && secrets.WHIZZARD_PASS || '7658978951' }}
          PYTHONUNBUFFERED: '1'
        run: |
          python daily_open_ticket_report.py

      - name: Print logs on failure
        if: failure()
        run: |
          echo "=== Daily logs ==="
          if [ -d "Whizzard_Downloads/_daily_logs" ]; then
            cat Whizzard_Downloads/_daily_logs/*.log || true
          fi
          echo "=== Download log ==="
          if [ -f "Whizzard_Downloads/download_log.csv" ]; then
            cat Whizzard_Downloads/download_log.csv || true
          fi

      - name: Upload Daily Open Ticket Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Daily-Open-Ticket-Report
          path: |
            Whizzard_Downloads/Daily_Open_Ticket_Reports/*.xlsx
            Whizzard_Downloads/_daily_logs/*.log
            Whizzard_Downloads/_debug/*
          retention-days: 90

      - name: Commit and push report to repository
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Whizzard_Downloads/Daily_Open_Ticket_Reports/*.xlsx
          git diff --staged --quiet || git commit -m "Automated Daily Ticket Report [skip ci]"
          git push
